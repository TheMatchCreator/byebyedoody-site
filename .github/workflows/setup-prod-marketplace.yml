name: Set up ByeByeDoody live marketplace

# Owner-approved 2026-11-16: marketplace on the live site with payments kept in TEST mode.
# Creates/uses the separate production database and sets the Pages PRODUCTION environment.
on:
  push:
    branches: [marketplace-auth]
    paths:
      - "ops/run-prod-setup"

permissions:
  contents: read

concurrency:
  group: setup-prod-marketplace
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up production database and live-site settings
        env:
          BBD_TARGET: production
          BBD_OWNER_ADMIN_ID: "auth0|6afc37f9b53fc5f0f4196a07"  # byebyedoody123@aol.com (owner, re-created 2026-11-17)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.BYEBYEDOODY_STRIPE_LIVE_KEY || secrets.BYEBYEDOODY_STRIPE_KEY }}
          BBD_REQUIRE_LIVE: ${{ secrets.BYEBYEDOODY_STRIPE_LIVE_KEY != '' && 'yes' || 'no' }}
          SWEEPANDGO_API_TOKEN: ${{ secrets.SWEEPANDGO_API_TOKEN }}
          CHECKR_API_KEY: ${{ secrets.CHECKR_API_KEY }}
          CHECKR_ENV: ${{ vars.CHECKR_ENV }}
        run: node scripts/setup-dev-marketplace.mjs
