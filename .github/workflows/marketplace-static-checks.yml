name: Marketplace static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find app functions -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Verify payment mode safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'readyForAuthenticatedTraffic: false' functions/api/marketplace/status.js
          grep -q 'paymentsMode: paymentsMode(env)' functions/api/marketplace/status.js
          grep -q '(sk|rk)_test_' functions/_shared/stripe.js
          grep -q '(sk|rk)_live_' functions/_shared/stripe.js
          grep -q 'event.livemode !== (paymentsMode(env) === "live")' functions/api/stripe-webhook.js
          grep -q 'CHECK (platform_fee_rate_basis_points = 2000)' migrations/0008_stripe_test_payments.sql
          grep -q 'CHECK (platform_fee_rate_basis_points BETWEEN 0 AND 5000)' migrations/0016_platform_fee_15pct.sql
          grep -q 'PLATFORM_FEE_BASIS_POINTS = 1500' functions/_shared/stripe.js
          # Sweep&Go: webhooks only trigger a pull (never trusted), claim links are stored hashed, admin-only lead data.
          grep -q 'never trusts the payload' functions/api/integrations/sweepandgo.js
          grep -q 'claim_token_hash' migrations/0017_sweepandgo_leads.sql
          grep -q 'requireUser(request, env, \["admin"\])' functions/api/marketplace/admin-sweepandgo.js
          grep -q 'email_mismatch' functions/api/marketplace/claim.js
          grep -q 'api_rate_limits' migrations/0006_api_rate_limits.sql
          grep -q 'matching_consent_at' migrations/0003_matching_consent.sql
          grep -q 'customer_fee_acknowledged_at' migrations/0001_marketplace_foundation.sql
