name: Marketplace static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find app functions -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done
      - name: Verify marketplace remains staged and payments are test-mode only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'readyForAuthenticatedTraffic: false' functions/api/marketplace/status.js
          grep -q 'paymentsMode: "test_only"' functions/api/marketplace/status.js
          grep -q '(sk|rk)_test_' functions/_shared/stripe.js
          grep -q 'livemode === true' functions/api/stripe-webhook.js
          grep -q 'CHECK (platform_fee_rate_basis_points = 2000)' migrations/0008_stripe_test_payments.sql
          grep -q 'api_rate_limits' migrations/0006_api_rate_limits.sql
          grep -q 'matching_consent_at' migrations/0003_matching_consent.sql
          grep -q 'customer_fee_acknowledged_at' migrations/0001_marketplace_foundation.sql
