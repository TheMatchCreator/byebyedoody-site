name: Apply ByeByeDoody development D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply remaining development migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          for file in \
            migrations/0002_marketplace_operations.sql \
            migrations/0003_referral_invitations.sql \
            migrations/0004_agreement_acknowledgements.sql \
            migrations/0005_notification_read_state.sql \
            migrations/0006_api_rate_limits.sql \
            migrations/0007_audit_review_indexes.sql \
            migrations/0008_manual_d1_audit_compatibility.sql
          do
            echo "Applying $file to byebyedoody-marketplace-dev"
            npx --yes wrangler@4 d1 execute byebyedoody-marketplace-dev --remote --file="$file"
          done
